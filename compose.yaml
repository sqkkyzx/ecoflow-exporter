services:
  ecoflow-exporter:
    build:
      context: .
    image: ecoflow-exporter:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    ports:
      - "${EXPORTER_BIND_ADDRESS:-0.0.0.0}:${EXPORTER_PORT:-9098}:${EXPORTER_PORT:-9098}"
    environment:
      ECOFLOW_ACCOUNT: ${ECOFLOW_ACCOUNT:-}
      ECOFLOW_PASSWORD: ${ECOFLOW_PASSWORD:-}
      ECOFLOW_SN: ${ECOFLOW_SN:-}
      ECOFLOW_DEVICE_NAME: ${ECOFLOW_DEVICE_NAME:-river3}
      ECOFLOW_API_HOST: ${ECOFLOW_API_HOST:-api-cn.ecoflow.com}
      EXPORTER_PORT: ${EXPORTER_PORT:-9098}
      EXPORTER_LISTEN: 0.0.0.0
      ECOFLOW_STALE_SECONDS: ${ECOFLOW_STALE_SECONDS:-120}
      ECOFLOW_READ_COOLDOWN_SECONDS: ${ECOFLOW_READ_COOLDOWN_SECONDS:-30}
      ECOFLOW_RECONNECT_MIN_SECONDS: ${ECOFLOW_RECONNECT_MIN_SECONDS:-5}
      ECOFLOW_RECONNECT_MAX_SECONDS: ${ECOFLOW_RECONNECT_MAX_SECONDS:-300}
      ECOFLOW_AUTH_RETRY_SECONDS: ${ECOFLOW_AUTH_RETRY_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
