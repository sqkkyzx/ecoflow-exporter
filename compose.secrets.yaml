# Standalone alternative to compose.yaml using file-based credentials.
services:
  ecoflow-exporter:
    image: ghcr.io/sqkkyzx/ecoflow-exporter:latest
    restart: unless-stopped
    ports:
      - "${EXPORTER_PORT:-9098}:${EXPORTER_PORT:-9098}"
    environment:
      ECOFLOW_ACCOUNT_FILE: /run/secrets/ecoflow_account
      ECOFLOW_PASSWORD_FILE: /run/secrets/ecoflow_password
      ECOFLOW_SN_FILE: /run/secrets/ecoflow_sn
      ECOFLOW_DEVICE_NAME: ${ECOFLOW_DEVICE_NAME:-river3}
      ECOFLOW_API_HOST: ${ECOFLOW_API_HOST:-api-cn.ecoflow.com}
      EXPORTER_PORT: ${EXPORTER_PORT:-9098}
      EXPORTER_LISTEN: 0.0.0.0
      ECOFLOW_STALE_SECONDS: ${ECOFLOW_STALE_SECONDS:-120}
      ECOFLOW_READ_COOLDOWN_SECONDS: ${ECOFLOW_READ_COOLDOWN_SECONDS:-30}
      ECOFLOW_RECONNECT_MIN_SECONDS: ${ECOFLOW_RECONNECT_MIN_SECONDS:-5}
      ECOFLOW_RECONNECT_MAX_SECONDS: ${ECOFLOW_RECONNECT_MAX_SECONDS:-300}
      ECOFLOW_AUTH_RETRY_SECONDS: ${ECOFLOW_AUTH_RETRY_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - ecoflow_account
      - ecoflow_password
      - ecoflow_sn

secrets:
  ecoflow_account:
    file: ./secrets/account
  ecoflow_password:
    file: ./secrets/password
  ecoflow_sn:
    file: ./secrets/sn
